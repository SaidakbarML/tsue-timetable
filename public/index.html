<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TSUE Timetable</title>
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%232563eb'/%3E%3Cpath d='M12 6v6l4 2' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5.5l3.5 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </span>
        <div>
          <h1>TSUE Timetable</h1>
          <p class="sub">Live from <a href="https://tsue.edupage.org/timetable/" target="_blank" rel="noopener">tsue.edupage.org</a></p>
        </div>
      </div>
      <button id="refreshBtn" class="icon-btn" type="button" title="Refresh data from EduPage" aria-label="Refresh data">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 4v5h5M20 20v-5h-5M4.5 15a8 8 0 0 0 14.6 2.4M19.5 9a8 8 0 0 0-14.6-2.4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <p id="statusLine" class="status-line muted">Loading data…</p>
  </header>

  <main>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab active" data-tab="class" role="tab" aria-selected="true">My class</button>
      <button class="tab" data-tab="rooms" role="tab" aria-selected="false">Free rooms</button>
    </nav>

    <section class="card" id="panel-class" data-panel="class">
      <div class="field">
        <label for="classSearch">Group / class name</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" class="input-icon"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="classSearch" type="text" inputmode="search" placeholder="e.g. MO-900/26" autocomplete="off" />
        </div>
        <div id="classResults" class="results"></div>
      </div>
      <div id="classOutput" class="output">
        <p class="hint">Search for your group above to see when your next class starts.</p>
      </div>
    </section>

    <section class="card" id="panel-rooms" data-panel="rooms" hidden>
      <div class="field">
        <label>Quick pick</label>
        <div id="periodChips" class="chip-row"><span class="muted">Loading periods…</span></div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="roomDate">Date</label>
          <input id="roomDate" type="date" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fromHour">From (24h)</label>
          <div class="time-select">
            <select id="fromHour" aria-label="From hour"></select>
            <span>:</span>
            <select id="fromMinute" aria-label="From minute"></select>
          </div>
        </div>
        <div class="field">
          <label for="toHour">To (24h)</label>
          <div class="time-select">
            <select id="toHour" aria-label="To hour"></select>
            <span>:</span>
            <select id="toMinute" aria-label="To minute"></select>
          </div>
        </div>
      </div>
      <div class="field">
        <label for="roomFilter">Room filter (optional)</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" class="input-icon"><path d="M4 21V9l8-6 8 6v12h-5v-7h-6v7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <input id="roomFilter" type="text" inputmode="search" placeholder="e.g. 202 or 8-" autocomplete="off" />
        </div>
      </div>
      <button id="checkRooms" class="primary-btn" type="button">Check availability</button>
      <div id="roomOutput" class="output"></div>
    </section>
  </main>

  <footer>
    <p class="muted">Regular weekly schedule only — one-off substitutions aren't reflected.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
